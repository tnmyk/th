name: Release to Cloudflare

on:
  push:
    tags:
      - 'v*' # Trigger workflow on version tags

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            rust_target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-macos
            rust_target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-macos
            rust_target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          
      - name: Build binary
        run: cargo build --release --target ${{ matrix.rust_target }}
        
      - name: Package binary
        shell: bash
        run: |
          cd target/${{ matrix.rust_target }}/release
          tar -czf th-${{ matrix.target }}.tar.gz th
          mv th-${{ matrix.target }}.tar.gz ../../../
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: th-${{ matrix.target }}
          path: th-${{ matrix.target }}.tar.gz

  deploy-cloudflare:
    name: Deploy to Cloudflare
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all binaries into public folder
        uses: actions/download-artifact@v4
        with:
          path: public/
          merge-multiple: true
          
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: your-project-name # <-- UPDATE THIS TO YOUR CLOUDFLARE PAGES PROJECT NAME
          directory: public
